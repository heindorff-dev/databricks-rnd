resources:
  jobs:
    rnd_ip_portfolio:
      name: rnd_ip_portfolio
      description: IP portfolio data product. Owns the patent_db silver tables. Optionally regenerates bronze, then always refreshes silver and gold.
      max_concurrent_runs: 1
      tags:
        "Research and Development": ""
        environment: ${var.environment}
      parameters:
        - name: init_bronze
          default: "false"
        - name: schemas
          default: >-
            ${var.patent_db_silver_schema},${var.ip_portfolio_gold_schema}
      tasks:
        - task_key: check_init_bronze
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.init_bronze}}"
            right: "true"

        - task_key: init_patent_db
          depends_on:
            - task_key: check_init_bronze
              outcome: "true"
          notebook_task:
            notebook_path: ../../../_shared/bronze_init/patent_db.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.patent_db_bronze_schema}

        # Bronze tables are recreated by the init task, so streaming checkpoints are reset.
        - task_key: refresh_full
          depends_on:
            - task_key: init_patent_db
          pipeline_task:
            pipeline_id: ${resources.pipelines.rnd_ip_portfolio_pipeline.id}
            full_refresh: true
        - task_key: refresh_incremental
          depends_on:
            - task_key: check_init_bronze
              outcome: "false"
          pipeline_task:
            pipeline_id: ${resources.pipelines.rnd_ip_portfolio_pipeline.id}

        - task_key: tag_tables
          depends_on:
            - task_key: refresh_full
            - task_key: refresh_incremental
          run_if: NONE_FAILED
          notebook_task:
            notebook_path: ../../../_shared/ops/tag_rnd_tables.py
            base_parameters:
              catalog: ${var.catalog}
              schemas: "{{job.parameters.schemas}}"

        - task_key: column_metadata
          depends_on:
            - task_key: tag_tables
          notebook_task:
            notebook_path: ../../metadata/column_metadata.sql
            base_parameters:
              catalog: ${var.catalog}
              patent_db_silver_schema: ${var.patent_db_silver_schema}
              ip_portfolio_gold_schema: ${var.ip_portfolio_gold_schema}
