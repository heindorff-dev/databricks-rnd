resources:
  pipelines:
    rnd_equipment_utilization_pipeline:
      name: rnd_equipment_utilization
      catalog: ${var.catalog}
      schema: ${var.equipment_utilization_gold_schema}
      serverless: true
      continuous: false
      root_path: ../../src
      libraries:
        - glob:
            include: ../../src/**
      configuration:
        catalog: ${var.catalog}
        equipment_iot_bronze_schema: ${var.equipment_iot_bronze_schema}
        equipment_iot_silver_schema: ${var.equipment_iot_silver_schema}
        equipment_utilization_gold_schema: ${var.equipment_utilization_gold_schema}
