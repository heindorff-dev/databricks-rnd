      grants:
        - principal: grp-rnd-silver-reader
          privileges: [SELECT, USE_SCHEMA]

    patent_db_silver:
      name: ${var.patent_db_silver_schema}
      catalog_name: ${var.catalog}
      comment: "R&D Patent database (intellectual property) silver data (cleaned, typed, documented)"
      grants:
        - principal: grp-rnd-silver-reader
