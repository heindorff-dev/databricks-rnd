resources:
  schemas:
    # ---------- Bronze (source systems) ----------
    benchling_bronze:
      name: ${var.benchling_bronze_schema}
      catalog_name: ${var.catalog}
      comment: "R&D Benchling (ELN experiments) bronze data (raw source extracts)"
      grants:
        - principal: grp-rnd-bronze-reader
          privileges: [SELECT, USE_SCHEMA]

    labware_bronze:
      name: ${var.labware_bronze_schema}
      catalog_name: ${var.catalog}
      comment: "R&D LabWare (LIMS samples, assays, results) bronze data (raw source extracts)"
