    # ---------- Gold (data products) ----------
    research_portfolio_gold:
      name: ${var.research_portfolio_gold_schema}
      catalog_name: ${var.catalog}
      comment: "Research portfolio data product: programs, projects, milestones, portfolio status and task throughput"
      grants:
        - principal: grp-rnd-gold-reader
          privileges: [SELECT, USE_SCHEMA]

    rd_financials_gold:
      name: ${var.rd_financials_gold_schema}
      catalog_name: ${var.catalog}
      comment: "R&D financials data product: monthly spend, budget versus actual and spend by program"
      grants:
        - principal: grp-rnd-gold-reader
          privileges: [SELECT, USE_SCHEMA]

    experimentation_gold:
      name: ${var.experimentation_gold_schema}
      catalog_name: ${var.catalog}
      comment: "Experimentation data product: experiments, outcomes, success rates and scientist productivity"
      grants:
        - principal: grp-rnd-gold-reader
          privileges: [SELECT, USE_SCHEMA]

    lab_quality_gold:
      name: ${var.lab_quality_gold_schema}
      catalog_name: ${var.catalog}
      comment: "Lab quality data product: sample results, assay pass rates, turnaround time and out-of-spec results"
      grants:
        - principal: grp-rnd-gold-reader
          privileges: [SELECT, USE_SCHEMA]

    clinical_trials_gold:
      name: ${var.clinical_trials_gold_schema}
      catalog_name: ${var.catalog}
      comment: "Clinical trials data product: trials, enrollment, site performance and adverse events"
      grants:
        - principal: grp-rnd-gold-reader
          privileges: [SELECT, USE_SCHEMA]

    regulatory_affairs_gold:
      name: ${var.regulatory_affairs_gold_schema}
      catalog_name: ${var.catalog}
      comment: "Regulatory affairs data product: submissions, approval cycle time and document compliance"
      grants:
        - principal: grp-rnd-gold-reader
          privileges: [SELECT, USE_SCHEMA]

    ip_portfolio_gold:
      name: ${var.ip_portfolio_gold_schema}
      catalog_name: ${var.catalog}
      comment: "IP portfolio data product: patents, status mix and expiry forecast"
      grants:
        - principal: grp-rnd-gold-reader
          privileges: [SELECT, USE_SCHEMA]

    equipment_utilization_gold:
      name: ${var.equipment_utilization_gold_schema}
      catalog_name: ${var.catalog}
      comment: "Equipment utilization data product: instrument usage, utilization by lab and downtime events"
      grants:
        - principal: grp-rnd-gold-reader
          privileges: [SELECT, USE_SCHEMA]

    # ---------- Governance ----------
    governance:
      name: ${var.governance_schema}
      catalog_name: ${var.catalog}
      comment: "R&D governance objects: ABAC column mask functions for PII"
      grants:
        - principal: account users
          privileges: [EXECUTE, USE_SCHEMA]
