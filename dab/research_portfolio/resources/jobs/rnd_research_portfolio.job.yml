resources:
  jobs:
    rnd_research_portfolio:
      name: rnd_research_portfolio
      description: Research portfolio data product. Owns the planview and jira_rd silver tables that other R&D products read. Optionally regenerates bronze, then always refreshes silver and gold.
      max_concurrent_runs: 1
      tags:
        "Research and Development": ""
        environment: ${var.environment}
      parameters:
        - name: init_bronze
          default: "false"
        - name: schemas
          default: >-
            ${var.planview_silver_schema},${var.jira_rd_silver_schema},${var.research_portfolio_gold_schema}
      tasks:
        - task_key: check_init_bronze
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.init_bronze}}"
            right: "true"

        - task_key: init_planview
          depends_on:
            - task_key: check_init_bronze
              outcome: "true"
          notebook_task:
            notebook_path: ../../../_shared/bronze_init/planview.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.planview_bronze_schema}
        - task_key: init_jira_rd
          depends_on:
            - task_key: check_init_bronze
              outcome: "true"
          notebook_task:
            notebook_path: ../../../_shared/bronze_init/jira_rd.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.jira_rd_bronze_schema}

        # Bronze tables are recreated by the init tasks, so streaming checkpoints are reset.
        - task_key: refresh_full
          depends_on:
            - task_key: init_planview
            - task_key: init_jira_rd
          pipeline_task:
            pipeline_id: ${resources.pipelines.rnd_research_portfolio_pipeline.id}
            full_refresh: true
        - task_key: refresh_incremental
          depends_on:
            - task_key: check_init_bronze
              outcome: "false"
          pipeline_task:
            pipeline_id: ${resources.pipelines.rnd_research_portfolio_pipeline.id}

        - task_key: tag_tables
          depends_on:
            - task_key: refresh_full
            - task_key: refresh_incremental
          run_if: NONE_FAILED
          notebook_task:
            notebook_path: ../../../_shared/ops/tag_rnd_tables.py
            base_parameters:
              catalog: ${var.catalog}
              schemas: "{{job.parameters.schemas}}"

        - task_key: column_metadata
          depends_on:
            - task_key: tag_tables
          notebook_task:
            notebook_path: ../../metadata/column_metadata.sql
            base_parameters:
              catalog: ${var.catalog}
              planview_silver_schema: ${var.planview_silver_schema}
              jira_rd_silver_schema: ${var.jira_rd_silver_schema}
              research_portfolio_gold_schema: ${var.research_portfolio_gold_schema}
