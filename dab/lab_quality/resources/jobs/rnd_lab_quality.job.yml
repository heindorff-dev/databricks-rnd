resources:
  jobs:
    rnd_lab_quality:
      name: rnd_lab_quality
      description: Lab quality data product. Owns the labware silver tables. Optionally regenerates bronze, then always refreshes silver and gold.
      max_concurrent_runs: 1
      tags:
        "Research and Development": ""
        environment: ${var.environment}
      parameters:
        - name: init_bronze
          default: "false"
        - name: schemas
          default: >-
            ${var.labware_silver_schema},${var.lab_quality_gold_schema}
      tasks:
        - task_key: check_init_bronze
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.init_bronze}}"
            right: "true"

        - task_key: init_labware
          depends_on:
            - task_key: check_init_bronze
              outcome: "true"
          notebook_task:
            notebook_path: ../../../_shared/bronze_init/labware.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.labware_bronze_schema}

        # Bronze tables are recreated by the init task, so streaming checkpoints are reset.
        - task_key: refresh_full
          depends_on:
            - task_key: init_labware
          pipeline_task:
            pipeline_id: ${resources.pipelines.rnd_lab_quality_pipeline.id}
            full_refresh: true
        - task_key: refresh_incremental
          depends_on:
            - task_key: check_init_bronze
              outcome: "false"
          pipeline_task:
            pipeline_id: ${resources.pipelines.rnd_lab_quality_pipeline.id}

        - task_key: tag_tables
          depends_on:
            - task_key: refresh_full
            - task_key: refresh_incremental
          run_if: NONE_FAILED
          notebook_task:
            notebook_path: ../../../_shared/ops/tag_rnd_tables.py
            base_parameters:
              catalog: ${var.catalog}
              schemas: "{{job.parameters.schemas}}"

        - task_key: column_metadata
          depends_on:
            - task_key: tag_tables
          notebook_task:
            notebook_path: ../../metadata/column_metadata.sql
            base_parameters:
              catalog: ${var.catalog}
              labware_silver_schema: ${var.labware_silver_schema}
              lab_quality_gold_schema: ${var.lab_quality_gold_schema}
